name: Plugin compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: librenms/librenms
          ref: d6da65b36d02c9b3ce5a63ccbc1a683ecc71100b
          path: upstream
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, mbstring, mysqli, pdo_mysql, pdo_sqlite, sockets, zip, xml, snmp
          coverage: none
          tools: composer:v2
      - name: Install upstream dependencies without application boot
        working-directory: upstream
        run: composer install --no-interaction --prefer-dist --no-scripts --no-progress
      - name: PHP syntax
        run: find GoAccess tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Real Hook and security checks
        run: php tests/run.php "$GITHUB_WORKSPACE/upstream"
      - uses: actions/checkout@v4
        with:
          repository: allinurl/goaccess
          ref: 0dda4e3cb0b3f38e43ec1f2e6dce18e2bbfb5956
          path: upstream-goaccess
      - uses: actions/checkout@v4
        with:
          repository: allinurl/goaccess
          ref: f79fb60df47b1c637174d61c67a207432698dce4
          path: upstream-goaccess-1.9.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/goaccess-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/goaccess-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: GoAccess template rendering in sandbox
        env:
          NODE_PATH: ${{ runner.temp }}/goaccess-browser/node_modules
        run: |
          node tests/browser.cjs "$(command -v php)" upstream-goaccess/resources/js/hogan.min.js upstream-goaccess/resources/tpls.html
          node tests/browser.cjs "$(command -v php)" upstream-goaccess-1.9.4/resources/js/hogan.min.js upstream-goaccess-1.9.4/resources/tpls.html
